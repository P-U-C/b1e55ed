# b1e55ed system defaults
# Override any value in config/user.yaml — do not edit this file directly.
# Secrets (API tokens, keys) belong in environment variables, not here.

preset: balanced  # Active risk/weight preset: balanced | conservative | degen

brain:
  cycle_interval_seconds: 1800  # How often the brain runs a full synthesis cycle (seconds). Default: 30 min.

universe:
  # symbols: []  # Optional: explicit override/supplement. If empty (default), the scoring
  #              # universe is automatically derived from enabled bundle symbols.
  #              # If set, these symbols supplement (not replace) enabled bundle symbols.
  #              # Example: symbols: ["BTC", "ETH", "SOL"]
  bundles: []   # Optional asset bundles (groups) — symbols in enabled bundles are auto-scored
  max_size: 100  # Maximum number of symbols tracked at once

execution:
  mode: paper              # Execution mode: paper (simulated fills) | live (real orders)
  paper_start_balance: 10000.0    # Starting balance for paper trading simulations (USD)
  confirmation_threshold_usd: 500.0  # Trade size below this skips confirmation prompt
  paper_min_days: 14       # Minimum days of paper trading required before live mode is allowed
  # Bundle-aware execution gating — restricts which asset classes and venues can be traded
  allowed_bundle_asset_classes: ["crypto"]   # Only trade these asset classes
  allowed_bundle_venues: ["global", "paper", "hyperliquid", "binance", "coinbase"]  # Allowed venues

karma:
  enabled: true            # Enable karma settlements (profit sharing with signal producers)
  percentage: 0.005        # Karma rate: 0.5% of realized profit goes to contributing producers
  settlement_mode: manual  # When karma is paid out: manual | daily | weekly | threshold
  threshold_usd: 50.0      # For threshold mode: settle when accumulated karma reaches this amount (USD)
  treasury_address: ""     # On-chain address to receive karma payments (leave empty to disable on-chain)

daemon:
  brain_interval_seconds: 300         # Fast brain cycle interval (seconds). Default: 5 min
  brain_full_interval_seconds: 21600  # Full deep-analysis cycle interval (seconds). Default: 6 hours
  resolver_interval_seconds: 1800     # How often expired signals are resolved and scored (seconds). Default: 30 min

logging:
  level: INFO         # Log verbosity: DEBUG | INFO | WARNING | ERROR
  json_output: false  # Output logs as JSON (useful for log aggregation pipelines)

dashboard:
  host: "127.0.0.1"  # Dashboard bind address. Use 0.0.0.0 to expose externally (add auth first!)
  port: 5051         # Dashboard HTTP port
  auth_token: ""     # Bearer token for dashboard access. Empty = no auth (local only)

api:
  host: "127.0.0.1"  # API bind address. Use 0.0.0.0 to expose externally (add auth first!)
  port: 5050         # API HTTP port
  auth_token: ""     # REQUIRED in production. Set via B1E55ED_API__AUTH_TOKEN env var.
  cors_origins: []   # Allowed CORS origins. Empty = CORS disabled. Example: ["https://mydashboard.com"]

# GitHub auto-publish: registers contributors publicly in a GitHub repository.
# Requires a personal access token with repo write access.
# If token is empty, publishing is silently skipped with a warning.
# Configure via publish.github (maps to Config.publish.github / PublishGithubConfig).
publish:
  github:
    owner: ""       # GitHub org/user that owns the contributor registry repo. Example: "my-org"
    repo: ""        # Repo name for contributor registry. Example: "b1e55ed-contributors"
    token: ""       # GitHub PAT with repo write access. Prefer B1E55ED_GITHUB_PUBLISH__TOKEN env var.
    mode: "issues"  # How contributors are registered: "issues" | "pr"
