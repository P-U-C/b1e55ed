# Conservative preset — lower risk tolerances, tighter position limits, curator-first weighting.
# Use when capital preservation is the priority, or during uncertain market conditions.
# Used when preset: conservative in default.yaml.

weights:
  # Domain weights must sum to 1.0. These control how much each signal source influences conviction.
  curator: 0.30    # Weight for operator-curated signals (your own alpha) — elevated vs balanced
  onchain: 0.25    # Weight for on-chain data (wallet flows, whale activity)
  tradfi: 0.20     # Weight for traditional finance signals (earnings, macro, equities)
  social: 0.10     # Weight for social/sentiment signals (CT, trending narratives) — reduced vs balanced
  technical: 0.10  # Weight for technical analysis signals (RSI, MA crossovers, structure)
  events: 0.05     # Weight for discrete events (listings, protocol upgrades, news)

risk:
  max_leverage: 1.0           # Maximum leverage allowed on any position — no leverage (spot only)
  max_position_pct: 0.05      # Maximum size of any single position as % of portfolio (5%) — half of balanced
  max_portfolio_heat_pct: 0.03  # Maximum total capital at risk across all open positions (3%) — half of balanced
  daily_loss_limit_pct: 0.02  # Kill switch trigger: stop trading if daily loss exceeds 2%
  max_drawdown_pct: 0.15      # Kill switch trigger: stop trading if drawdown from peak exceeds 15%
