# User config — your personal overrides on top of the defaults and preset.
# Only include fields you want to change. Everything else inherits from default.yaml + preset.
# Never commit secrets here — use environment variables instead.

api:
  auth_token: "d3FlLSCvNcxEGDexTReZmdJfP7JIwnB0OtoTrsklCYE"  # API auth token. Generate with: openssl rand -base64 32

daemon:
  brain_interval_seconds: 900       # Override: run brain every 15 min (default: 5 min)
  brain_full_interval_seconds: 21600  # Override: full cycle every 6 hours (unchanged)
  resolver_interval_seconds: 3600   # Override: resolve signals every 60 min (default: 30 min)

