# User config — personal overrides on top of defaults and preset.
# Reconciled 2026-04-07: aligned with runtime ~/.b1e55ed/config/user.yaml

api:
  auth_token: "CHANGE_ME"  # Placeholder — override in ~/.b1e55ed/config/user.yaml or B1E55ED_API__AUTH_TOKEN env var

daemon:
  brain_interval_seconds: 300
  brain_full_interval_seconds: 21600  # 6h — full deep-analysis cycle. Runtime had 1800 (30min)
                                      # which is too aggressive for a full cycle and overlaps with
                                      # brain_interval_seconds (5min fast cycle). 6h is correct
                                      # per default.yaml and gives producers time to accumulate.
  resolver_interval_seconds: 1800

brain:
  auto_paper_trade: true
  auto_paper_trade_min_confidence: 0.35
  auto_paper_trade_min_magnitude: 3.0  # Was 0.5 runtime / 2.0 repo. 3.0 is the safe middle:
                                       # below 3.0 triggers a code warning (orchestrator.py:561),
                                       # 0.5 was firing on noise, 2.0 was still too low for
                                       # production. 5.0+ recommended before live trading.

universe:
  symbols:
    - BTC
    - ETH
    - SOL
    - SUI
    - HYPE

execution:
  paper_ignore_consecutive_loss_gate: true

kill_switch:
  l3_crisis_threshold: 5
