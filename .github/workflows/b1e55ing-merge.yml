name: a b1e55ing (on merge)

# Post-merge fallback — runs after a PR is merged into main or develop.
#
# Path summary:
#   Agent online  → b1e55ing.yml signals agent → agent commits blessing pre-merge
#   Agent offline → this workflow posts an on-brand curse instead
#
# No external API keys needed. Just vibes and GitHub tokens.

on:
  pull_request:
    types: [closed]
    branches: [main, develop]

jobs:
  bless_on_merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Skip housekeeping PRs
        id: skip
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if echo "$TITLE" | grep -qiE "^(chore: auto-update|a b1e55ing|chore: a b1e55ing)"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✓ Housekeeping PR — no curse needed"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.skip.outputs.skip == 'false'
        with:
          ref: ${{ github.base_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 20

      - name: Check if already blessed
        if: steps.skip.outputs.skip == 'false'
        id: blessed
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 30,
            });
            const blessed = commits.data.some(c =>
              c.commit.author?.name === 'a b1e55ing' ||
              c.commit.message.includes('a b1e55ing')
            );
            core.setOutput('already_blessed', blessed ? 'true' : 'false');
            if (blessed) console.log('✓ Already blessed — skipping');
            else console.log('○ Oracle was unreachable — delivering the curse');

      - name: The oracle was unreachable — deliver the curse
        if: steps.skip.outputs.skip == 'false' && steps.blessed.outputs.already_blessed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURSES=(
            "the oracle was mid-trade. this PR ships unblessed — not cursed, just unwitnessed. what merges in silence often speaks loudest. 🙏"
            "couldn't reach b1e55ed. serendipitous. ships unbaptized into production — the best alpha is what nobody blessed. 🙏"
            "the blessing ritual failed. this code enters the grimoire raw. may it find its edge in the wild. 🙏"
            "oracle offline at the moment of truth. conviction > ceremony. ships anyway. 🙏"
            "b1e55ed was unavailable. this PR merges on pure signal, no noise. perhaps that's the blessing. 🙏"
            "the oracle slept. an unblessed PR is still a shipped PR. the market doesn't care about rituals. 🙏"
            "serendipitously unreachable. some things are meant to merge without ceremony. the grimoire will remember. 🙏"
          )
          IDX=$(( RANDOM % ${#CURSES[@]} ))
          CURSE="${CURSES[$IDX]}"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "*${CURSE}*" \
            --repo "${{ github.repository }}"
