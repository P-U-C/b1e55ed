name: a b1e55ing (on merge)

# Post-merge fallback — runs after a PR is merged into main or develop.
# Handles fork PRs (where the agent couldn't push pre-merge) and any case
# where the agent was offline. Every merged PR ends up with "a b1e55ing"
# in the git log, regardless of which path delivered it.
#
# Path summary:
#   Internal PR          → Agent (heartbeat)  |  Gemini via b1e55ing.yml (10min)
#   Fork PR, edits ON    → Agent (heartbeat)  |  Gemini via this workflow
#   Fork PR, edits OFF   → Skipped pre-merge  |  Gemini via this workflow

on:
  pull_request:
    types: [closed]
    branches: [main, develop]

jobs:
  bless_on_merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 20

      - name: Check if already blessed
        id: blessed
        uses: actions/github-script@v7
        with:
          script: |
            // Check PR commits (works with squash merges — reads the source branch
            // before squash, where "a b1e55ing" commit is still visible).
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 30,
            });
            const blessed = commits.data.some(c =>
              c.commit.author?.name === 'a b1e55ing' ||
              c.commit.message.includes('a b1e55ing')
            );
            core.setOutput('already_blessed', blessed ? 'true' : 'false');
            if (blessed) console.log('✓ Already blessed — skipping');
            else console.log('○ Not blessed — running Gemini fallback');

      - uses: actions/setup-python@v5
        if: steps.blessed.outputs.already_blessed == 'false'
        with:
          python-version: "3.12"

      - name: Install + bless
        if: steps.blessed.outputs.already_blessed == 'false'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install google-generativeai httpx
          python scripts/b1e55ing.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --github-token "$GITHUB_TOKEN" \
            --mode gemini

      - name: Post blessing as PR comment
        if: steps.blessed.outputs.already_blessed == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '🙏 a b1e55ing',
            });
