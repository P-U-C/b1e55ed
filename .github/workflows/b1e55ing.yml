name: a b1e55ing

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, develop]

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Skip fork PRs
        if: github.event.pull_request.head.repo.fork == true
        run: |
          echo "Fork PR — post-merge fallback will catch it."
          exit 0

      - name: Check if already blessed
        id: blessed
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const blessed = commits.data.some(c => c.commit.message.includes('a b1e55ing'));
            core.setOutput('already_blessed', blessed ? 'true' : 'false');
            if (blessed) console.log('✓ Already blessed');
            else console.log('○ Not yet blessed — signalling agent');

      - name: Signal agent via Telegram
        if: steps.blessed.outputs.already_blessed == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=[b1e55ing] PR #${{ github.event.pull_request.number }} opened on ${{ github.repository }} — ${{ github.event.pull_request.title }}
Branch: ${{ github.head_ref }}
Run: b1e55ing.py --pr-number ${{ github.event.pull_request.number }} --mode agent" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Signal sent' if r.get('ok') else f'Signal failed: {r}')"
