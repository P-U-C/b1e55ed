name: a b1e55ing

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main, develop]

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Skip fork PRs
        if: github.event.pull_request.head.repo.fork == true
        run: echo "Fork PR — handled by agent or on-merge fallback." && exit 0

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx google-generativeai

      - name: Wait for agent blessing
        run: |
          echo "Waiting 10 minutes for agent to bless this PR..."
          sleep 600

      - name: Check if already blessed
        id: blessed
        run: |
          git fetch origin ${{ github.head_ref }}
          COMMITS=$(git log --oneline --grep="a b1e55ing" origin/${{ github.head_ref }} | head -1)
          if [ -n "$COMMITS" ]; then
            echo "already_blessed=true" >> $GITHUB_OUTPUT
            echo "Agent already blessed this PR — skipping Gemini fallback."
          else
            echo "already_blessed=false" >> $GITHUB_OUTPUT
            echo "No agent blessing found — running Gemini fallback."
          fi

      - name: Run Gemini fallback
        if: steps.blessed.outputs.already_blessed == 'false'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/b1e55ing.py \
            --pr-number ${{ github.event.pull_request.number }} \
            --github-token "$GITHUB_TOKEN" \
            --mode gemini

      - name: Commit
        if: steps.blessed.outputs.already_blessed == 'false'
        run: |
          git config user.name "a b1e55ing"
          git config user.email "bot@permanentupperclass.com"
          git diff --quiet || (git add -A && git commit -m "chore: a b1e55ing [skip ci]")
          git push || true
