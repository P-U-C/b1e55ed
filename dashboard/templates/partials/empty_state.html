<div class="empty-state-unified">
  <div class="empty-state-unified__msg">{{ message | default("NO DATA") }}</div>
  {% if status %}<div class="empty-state-unified__status">{{ status }}</div>{% endif %}
  {% if action_text and action_url %}
  <a href="{{ action_url }}" class="empty-state-unified__action">{{ action_text }} →</a>
  {% endif %}
</div>
