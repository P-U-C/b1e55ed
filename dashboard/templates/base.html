<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}b1e55ed{% endblock %}</title>

  <!-- HTMX -->
  <script src="/static/htmx.min.js"></script>

  <!-- High contrast preference restore -->
  <script>
  (function(){
    if(localStorage.getItem('b1e55ed:hc')==='true') document.documentElement.setAttribute('data-high-contrast','true');
  })();
  </script>

  <!-- CRT → PUC Aesthetic -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- Film grain overlay -->
  <div class="grain"></div>

  <!-- ── Nav ──────────────────────────────────── -->
  <nav class="nav">
    <button class="nav-hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">≡</button>

    <a href="/" class="nav-logo">b1e55<span class="hex">ed</span></a>

    <div class="nav-links">
      <a href="/" class="nav-link {% if active_page == 'brain' %}active{% endif %}">Brain</a>
      <a href="/cockpit" class="nav-link {% if active_page == 'cockpit' %}active{% endif %}">Cockpit</a>
      <a href="/signals" class="nav-link {% if active_page == 'signals' %}active{% endif %}">Signals</a>
      <a href="/producers" class="nav-link {% if active_page == 'producers' %}active{% endif %}">Producers</a>
      <a href="/positions" class="nav-link {% if active_page == 'positions' %}active{% endif %}">Positions</a>
      <a href="/performance" class="nav-link {% if active_page == 'performance' %}active{% endif %}">Perf</a>
      <a href="/forecasts" class="nav-link {% if active_page == 'forecasts' %}active{% endif %}">Forecasts</a>
      <a href="/settings" class="nav-link {% if active_page == 'settings' %}active{% endif %}">Settings</a>
      <div class="nav-overflow">
        <button class="nav-overflow__trigger" id="nav-more-btn" onclick="(function(){var m=document.getElementById('nav-more-menu');m.style.display=m.style.display==='block'?'none':'block';})()" aria-label="More pages">···</button>
        <div class="nav-overflow__menu" id="nav-more-menu" style="display:none">
          <a href="/social">Social</a>
          <a href="/artifacts">Artifacts</a>
          <a href="/treasury">Treasury</a>
        </div>
      </div>
    </div>

    <div class="nav-right">
      <!-- Live Market Ticker -->
      <div id="market-ticker"
           class="market-ticker"
           hx-get="/api/market-ticker"
           hx-trigger="load, every 60s"
           hx-swap="innerHTML"
           hx-target="#market-ticker-inner">
        <span id="market-ticker-inner" class="ticker-coins">—</span>
      </div>

      <div class="kill-dot level-{{ kill_switch_level | default(0) }}"
           title="Kill switch: level {{ kill_switch_level | default(0) }}"
           hx-get="/partials/kill-dot"
           hx-trigger="every 30s"
           hx-swap="outerHTML"></div>

      <span class="regime-pill regime-{{ regime | default('unknown') | lower | replace(' ', '_') }}"
            hx-get="/partials/regime-pill"
            hx-trigger="every 30s"
            hx-swap="outerHTML">
        {{ regime | default('UNKNOWN') | upper }}
      </span>
    </div>
  </nav>

  <!-- Vitals Bar -->
  <div id="vitals-bar" class="vitals-bar"
       hx-get="/partials/vitals-bar"
       hx-trigger="load, every 15s"
       hx-swap="innerHTML">
    <span class="vitals-item"><span class="vitals-label">SIGNAL</span> <span class="vitals-value">—</span></span>
  </div>

  <!-- ── Page Content ─────────────────────────── -->
  <main class="page" style="padding-top: 76px;">
    {% block content %}{% endblock %}
  </main>

  <!-- Neural mesh background -->
  <script src="/static/synapses.js"></script>

  <!-- Market ticker HTMX handler -->
  <script>
  document.addEventListener('htmx:beforeSwap', function(e) {
    if (e.detail.target && e.detail.target.id === 'market-ticker-inner') {
      try {
        var data = JSON.parse(e.detail.xhr.responseText);
        var html = '';
        if (data.coins && data.coins.length) {
          data.coins.forEach(function(c, i) {
            var dir = c.change_24h >= 0 ? 'bull' : 'bear';
            var sign = c.change_24h >= 0 ? '+' : '';
            var price = c.price >= 1000 ? c.price.toLocaleString('en-US', {maximumFractionDigits:0}) : c.price.toFixed(2);
            html += '<span class="ticker-coin">';
            html += '<span class="ticker-sym">' + c.symbol + '</span>';
            html += ' $' + price + ' ';
            html += '<span class="ticker-' + dir + '">' + sign + c.change_24h.toFixed(1) + '%</span>';
            html += '</span>';
            if (i < data.coins.length - 1) html += '<span class="ticker-sep">\u00b7</span>';
          });
        } else {
          html = '\u2014';
        }
        e.detail.target.innerHTML = html;
        e.detail.shouldSwap = false;
      } catch(err) { /* let HTMX handle as text */ }
    }
  });
  </script>

  <script>
  document.body.addEventListener('htmx:responseError', function(e) {
    var target = e.detail.target;
    if (!target) return;
    var status = e.detail.xhr ? e.detail.xhr.status : '?';
    target.innerHTML = '<span class="text-red-400 text-sm">\u2717 Error ' + status + '</span>';
  });

  // Nav overflow outside-click handler
  document.addEventListener('click', function(e) {
    var menu = document.getElementById('nav-more-menu');
    var btn = document.getElementById('nav-more-btn');
    if (menu && menu.style.display === 'block' && btn && !menu.contains(e.target) && e.target !== btn) {
      menu.style.display = 'none';
    }
  });
  </script>

  {% block scripts %}{% endblock %}

  <!-- Footer -->
  <footer style="position:fixed; bottom:0; left:0; right:0; height:24px; background:rgba(10,10,10,0.95); border-top:1px solid rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-family:'JetBrains Mono',monospace; font-size:10px; color:#3a3630; z-index:50; backdrop-filter:blur(4px);">
    <span>b1e55<span style="color:#22C55E;">ed</span> &nbsp;·&nbsp; dashboard <span style="color:#5a5650;">v{{ dashboard_version }}</span></span>
    <span style="color:#2a2620;">permanentupperclass.com</span>
  </footer>
  <!-- push content above fixed footer -->
  <style>main.page { padding-bottom: 32px; }</style>
</body>
</html>
